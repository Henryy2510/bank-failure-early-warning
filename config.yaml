# Central configuration of the pipeline. All paths are relative to the project root (final/).
paths:
  raw: ./data_raw/fdic              # raw FDIC files (scripts/00_download.py or the course starter writes here)
  data: data                        # bronze / silver / gold layers (git-ignored)
  outputs: outputs                  # tables, figures, logs (committed)

seed: 42

panel:
  publication_lag_days: 60          # Call Report filing deadline (30-35 d) + FDIC publication buffer
  exit_failure_min_gap_days: -90    # FAILDATE - last report date must lie in [min, max] to call an exit a failure
  exit_failure_max_gap_days: 540

label:
  last_label_quarter: "2025-06-30"  # y = 1{fail in (q, q+4 quarters]}; later labels are incomplete

features:
  texas_cap: 10.0                   # Texas ratio is capped; a non-positive denominator (EQ + reserves <= 0) = cap

split:
  dev_end: "2007-12-31"             # development period: as-of quarters 1984Q1-2007Q4
  test_start: "2009-03-31"          # gap 2008Q1-2008Q4 (purge: dev labels look up to 2008Q4)
  test_end: "2025-06-30"
  # walk-forward validation blocks inside the development period (inclusive years)
  cv_blocks: [[1988, 1988], [1990, 1990], [1992, 1992], [1994, 1999], [2000, 2007]]

cost:
  # cost of a missed failure = median FDIC resolution loss rate (COST / assets at failure, dev failures only)
  #                            x capped assets of the missed bank (inflation-neutral, bank-level)
  # cost of a false alarm    = one targeted (off-cycle) examination per false-alarm episode; reported with sensitivity
  false_alarm_cost_kusd: 250
  sensitivity_false_alarm_kusd: [100, 250, 500, 1000]
  theta_grid: {min: 0.0001, max: 0.90, n: 300, scale: log}
  alarm_budget_pct: [1, 2, 5]
  episode_cost: true
  asset_cap_quantile: 0.85

explainability:
  perm_repeats: 5
  max_neg_per_fold: 25000
  top_k: 10

case_studies:
  top_gfc: 5
  top_modern: 5

spark:
  master: "local[2]"
  driver_memory: "1200m"
  shuffle_partitions: 8
